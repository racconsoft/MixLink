[package]
name = "wavelinkd"
version = "0.1.0"
edition = "2024"

[lib]
name = "wavelinkd"
path = "src/lib.rs"

[[bin]]
name = "wavelinkd"
path = "src/main.rs"

[dependencies]
wavelink-core = { path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "signal"] }
libspa-sys = "0.10.1"
pipewire = "0.10.1"
pipewire-sys = "0.10.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "test-util"] }
