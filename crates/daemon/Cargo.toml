[package]
name = "mixlinkd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MixLink daemon: a Wave Link-style audio mixer for Linux/PipeWire"
readme = "../../README.md"

[lib]
name = "mixlinkd"
path = "src/lib.rs"

[[bin]]
name = "mixlinkd"
path = "src/main.rs"

[dependencies]
mixlink-core = { path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "signal"] }
libspa-sys = "0.10.1"
pipewire = "0.10.1"
pipewire-sys = "0.10.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "test-util"] }
