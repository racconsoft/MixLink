[package]
name = "wavelinkd"
version = "0.1.0"
edition = "2024"

[lib]
name = "wavelinkd"
path = "src/lib.rs"

[dependencies]
wavelink-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
toml = "1"

[dev-dependencies]
tempfile = "3"
