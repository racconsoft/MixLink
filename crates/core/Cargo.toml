[package]
name = "mixlink-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared protocol, config and client types for MixLink"
readme = "../../README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt"], optional = true }

[features]
tokio = ["dep:tokio"]

[dev-dependencies]
tempfile = "3"
toml = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "macros", "time"] }
