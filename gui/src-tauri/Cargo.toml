[package]
name = "mixlink-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tauri-based GUI for MixLink, a Wave Link-style audio mixer for Linux/PipeWire"
readme = "../../README.md"

[[bin]]
name = "mixlink-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ksni = "0.3.6"
mixlink-core = { path = "../../crates/core", features = ["tokio"] }
mixlink-desktop = { path = "../../crates/desktop" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
