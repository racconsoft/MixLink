[package]
name = "mixlink-gui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mixlink-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mixlink-core = { path = "../../crates/core", features = ["tokio"] }
mixlink-desktop = { path = "../../crates/desktop" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
